<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#22232b"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Fit31 — твой путь к силе</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#202129;color:#f6f3ff}*{box-sizing:border-box}body{margin:0}main{max-width:740px;margin:auto;padding:24px 16px 100px}.brand{letter-spacing:.2em;color:#b5a0ff;font-size:12px;font-weight:800}h1{font-size:30px;margin:8px 0}h2{font-size:22px}h3{margin:0 0 8px}.muted{color:#b4b1c4}.panel{background:#2e2f3a;border:1px solid #434451;border-radius:20px;padding:20px;margin:14px 0}.progress{height:10px;border-radius:20px;background:#4b4b59;overflow:hidden}.fill{height:100%;background:#ac92ff;transition:width .2s}button,.button{border:0;border-radius:12px;background:#aa90f7;color:#17151e;font:700 15px system-ui;padding:13px 17px;cursor:pointer}button.secondary{background:#454553;color:#f5f1ff}button.outline{background:transparent;border:1px solid #8173a5;color:#e2d7ff}button:disabled{opacity:.4;cursor:not-allowed}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.wrap{flex-wrap:wrap}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#252631;border-top:1px solid #494858;padding:9px max(8px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));z-index:10}.tabs button{flex:1;max-width:145px;background:transparent;color:#bcb9cb;padding:10px 2px;font-size:12px}.tabs button.active{color:#b6a0ff;background:#383445}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.day{min-height:60px;padding:8px 2px;border-radius:12px;background:#3b3c49;color:white;font-size:13px}.day small{display:block;color:#c3b8e2}.day.done{background:#376c5c}.day.skip{background:#6a4852}.day.current{outline:2px solid #b4a0ff}.exercise{padding:15px;border:1px solid #4c4a5a;border-radius:15px;margin:10px 0}.exercise p{line-height:1.55}.set{margin:4px;background:#464457;color:white}.set.done{background:#64b79d;color:#102a24}.note{background:#3b354d;padding:12px;border-radius:12px;color:#ded4ff;font-size:14px}.small{font-size:13px}.hidden{display:none}input,textarea,select{width:100%;border:1px solid #68637a;background:#23242d;border-radius:10px;color:white;padding:12px;font:inherit;margin:5px 0 12px}label{display:block;color:#d8d1e8;font-size:14px}.pill{display:inline-block;background:#514668;color:#eadfff;padding:5px 10px;border-radius:20px;font-size:12px}dialog{background:#30303b;color:white;border:1px solid #8b79b8;border-radius:20px;max-width:min(92vw,440px);padding:22px}dialog::backdrop{background:#0009}a{color:#c8b5ff}.timer{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;margin:12px}
</style></head><body><main id="app"></main><nav class="tabs" id="tabs"></nav><dialog id="dlg"></dialog><script src="data.js"></script><script>
const dbkey='fit31-progress-v1';let state;try{state=JSON.parse(localStorage.getItem(dbkey))||{}}catch{state={}};state.days??={};state.sets??={};state.notes??={};state.measurements??={};state.startDate??=new Date().toISOString().slice(0,10);state.selected??=1;let page='home',timerEnd=0,timerInterval=null;const $=id=>document.getElementById(id),save=()=>{try{localStorage.setItem(dbkey,JSON.stringify(state))}catch{alert('Не удалось сохранить данные. Сделай резервную копию.')}},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>new Date().toISOString().slice(0,10),schedule=FIT31.schedule,workout=day=>FIT31.workouts.find(w=>w.id===schedule[day-1].workoutId),ex=id=>FIT31.exercises.find(e=>e.id===id),doneCount=()=>Object.values(state.days).filter(x=>x.status==='completed').length;function scheduledToday(){let d=Math.floor((new Date(today()+'T12:00:00')-new Date(state.startDate+'T12:00:00'))/86400000)+1;return Math.max(1,Math.min(31,d))}function navigate(p){page=p;render()}function chooseDay(d){state.selected=d;save();page='workout';render()}function render(){let a=$('app');$('tabs').innerHTML=[['home','⌂ Главная'],['calendar','▦ Календарь'],['workout','◉ Занятие'],['progress','▥ Прогресс'],['settings','⚙ Настройки']].map(([p,t])=>`<button class="${p===page?'active':''}" onclick="navigate('${p}')">${t}</button>`).join('');a.innerHTML='<div class="brand">FIT31 · ТВОЙ ПУТЬ К СИЛЕ</div>'+({home:home,calendar:calendar,workout:workoutPage,progress:progress,settings:settings}[page])()}
function home(){let d=scheduledToday(),pending=Array.from({length:Math.max(0,d-1)},(_,i)=>i+1).filter(x=>!state.days[x]);let w=workout(d);return `<h1>Твой путь к силе 💜</h1><p class="muted">Маленькие шаги каждый день. Без гонки за идеалом.</p><div class="panel"><div class="row"><strong>Пройдено ${doneCount()} из 31</strong><span>${Math.round(doneCount()/31*100)}%</span></div><div class="progress" style="margin-top:12px"><div class="fill" style="width:${doneCount()/31*100}%"></div></div></div>${pending.length?`<div class="panel"><h3>Есть пропущенные дни</h3><p class="muted">Можно продолжить с последнего невыполненного дня или перейти к сегодняшнему. Ничего не обнуляется.</p><div class="row wrap"><button class="secondary" onclick="chooseDay(${pending[0]})">Вернуться к дню ${pending[0]}</button><button onclick="chooseDay(${d})">День ${d} по календарю</button></div></div>`:''}<div class="panel"><span class="pill">День ${d} · Комплекс ${w.id}</span><h2>${esc(w.title)}</h2><p class="muted">${w.kind==='recovery'?'Спокойная восстановительная практика':'Тренировка по плану, с паузами и разминкой'}</p><button onclick="chooseDay(${d})">${state.days[d]?.status==='completed'?'Посмотреть тренировку':'Открыть тренировку'} →</button></div><div class="note">Плоский живот за 31 день не гарантирован: цель — укрепление корпуса, регулярность и хорошее самочувствие. При резкой боли или головокружении остановись.</div>`}
function calendar(){return `<h1>Календарь</h1><p class="muted">Зелёный — завершено, красный — пропущено. Нажми на любой день.</p><div class="panel"><div class="days">${schedule.map((s,i)=>{let d=i+1,st=state.days[d]?.status;return `<button class="day ${st==='completed'?'done':st==='skipped'?'skip':''} ${d===scheduledToday()?'current':''}" onclick="chooseDay(${d})">${d}<small>${s.workoutId==='ZH'?'Ж':s.workoutId==='V'?'В':s.workoutId==='G'?'Г':s.workoutId}</small>${st==='completed'?'✓':st==='skipped'?'–':''}</button>`}).join('')}</div></div><div class="note">День программы привязан к дате старта. При пропуске ты сама выбираешь, какое занятие открыть следующим.</div>`}
function target(t){return `${t.min===t.max?t.min:t.min+'–'+t.max} ${t.unit==='reps'?'раз':t.unit==='minutes'?'мин':'сек'}${t.scope==='per_side'?' на сторону':''}`}
function setsFor(p,d,w){if(w.kind==='recovery')return p.sets;if(d<=7)return Math.min(2,p.sets);if(d<=14&&p.sets===3)return state.loadChoice?.[d]===3?3:2;return p.sets}
function workoutPage(){let d=state.selected,w=workout(d),records=state.sets[d]||{},all=w.prescriptions.every(p=>Array.from({length:setsFor(p,d,w)},(_,i)=>records[p.id+'-'+i]).every(Boolean));let warm=FIT31.sharedBlocks.standard_warmup,cool=FIT31.sharedBlocks.standard_cooldown;return `<div class="row"><h1>День ${d}</h1><span class="pill">${w.id==='ZH'?'Ж':w.id==='V'?'В':w.id==='G'?'Г':w.id}</span></div><h2>${esc(w.title)}</h2><p class="muted">${w.kind==='recovery'?'Восстановление без увеличения нагрузки':'Работай плавно, отдыхай по необходимости'}</p>${d>=8&&d<=14&&w.kind==='strength'?`<div class="panel"><label>Количество подходов для упражнений с исходными 3 подходами</label><select onchange="setLoad(${d},this.value)"><option value="2" ${state.loadChoice?.[d]!==3?'selected':''}>2 — облегчённый вариант</option><option value="3" ${state.loadChoice?.[d]===3?'selected':''}>3 — если техника и восстановление хорошие</option></select></div>`:''}${w.kind==='strength'?`<details class="panel"><summary><strong>Разминка · 6 минут</strong></summary>${warm.steps.map(s=>`<p>${esc(s.text)}</p>`).join('')}</details>`:`<div class="note">Восстановление: 5 мин дыхания и разминки, 25 мин мягких движений, 5 мин повторения комфортных движений, 5 мин расслабления.</div>`}<h3>Упражнения</h3>${w.prescriptions.map(p=>{let e=ex(p.exerciseId),n=setsFor(p,d,w);return `<section class="exercise"><h3>${esc(e.name)}</h3><p class="muted small">${esc(p.sourcePrescription)} · Сегодня ${n} ${n===1?'подход':n<5?'подхода':'подходов'}</p><p>${esc(e.instructions[0])}</p><div class="row wrap">${Array.from({length:n},(_,i)=>`<button class="set ${records[p.id+'-'+i]?'done':''}" onclick="toggleSet(${d},'${p.id}',${i})">${records[p.id+'-'+i]?'✓ ':''}${i+1}-й · ${target(p.target)}</button>`).join('')}</div></section>`}).join('')}${w.kind==='strength'?`<details class="panel"><summary><strong>Заминка · 5 минут</strong></summary>${cool.steps.map(s=>`<p>${esc(s.text)}</p>`).join('')}</details>`:''}<div class="panel"><h3>Таймер отдыха</h3><div class="timer" id="timer">00:45</div><div class="row wrap"><button onclick="startTimer(45)">45 сек</button><button class="secondary" onclick="startTimer(60)">60 сек</button><button class="outline" onclick="stopTimer()">Стоп</button></div></div><div class="panel"><label>Самочувствие и заметки</label><textarea id="daynote" rows="2" placeholder="Как прошла тренировка?" oninput="saveNote(${d},this.value)">${esc(state.notes[d]||'')}</textarea><div class="row wrap"><button ${all?'':'disabled'} onclick="finish(${d})">${state.days[d]?.status==='completed'?'✓ Завершено':'Завершить день'}</button><button class="secondary" onclick="skipDay(${d})">Отметить пропуск</button></div><p class="muted small">Для завершения отметь все подходы. Если тренировку прервали, результат подходов останется сохранённым.</p></div>`}
function setLoad(d,v){state.loadChoice??={};state.loadChoice[d]=Number(v);save();render()}function toggleSet(d,p,i){state.sets[d]??={};let k=p+'-'+i;state.sets[d][k]=!state.sets[d][k];if(state.days[d]?.status==='completed')delete state.days[d];save();render()}function saveNote(d,v){state.notes[d]=v;save()}function finish(d){state.days[d]={status:'completed',date:today()};save();alert('Отличная работа! День '+d+' завершён 💜');navigate('home')}function skipDay(d){if(confirm('Отметить день '+d+' как пропущенный? Прогресс остальных дней сохранится.')){state.days[d]={status:'skipped',date:today()};save();navigate('calendar')}}function startTimer(sec){stopTimer();timerEnd=Date.now()+sec*1000;timerInterval=setInterval(()=>{let left=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));let el=$('timer');if(el)el.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;if(left===0){stopTimer();if(navigator.vibrate)navigator.vibrate(200)}},150)}function stopTimer(){if(timerInterval)clearInterval(timerInterval);timerInterval=null}
function progress(){return `<h1>Мой прогресс</h1><div class="panel"><h2>${doneCount()} / 31 дней</h2><div class="progress"><div class="fill" style="width:${doneCount()/31*100}%"></div></div><p class="muted">${Math.round(doneCount()/31*100)}% программы завершено</p></div><h2>Измерения (необязательно)</h2><p class="muted">Измерения в дни 1, 15 и 31. Не нужно стремиться к определённой цифре.</p>${[1,15,31].map(d=>`<div class="panel"><h3>День ${d}</h3><label>Талия, см<input type="number" min="0" step="0.1" value="${esc(state.measurements[d]?.waist??'')}" onchange="measure(${d},'waist',this.value)"></label><label>Живот, см<input type="number" min="0" step="0.1" value="${esc(state.measurements[d]?.abdomen??'')}" onchange="measure(${d},'abdomen',this.value)"></label></div>`).join('')}`}
function measure(d,k,v){state.measurements[d]??={};state.measurements[d][k]=v===''?null:Number(v);save()}
function settings(){return `<h1>Настройки</h1><div class="panel"><label>Дата начала программы<input type="date" value="${esc(state.startDate)}" onchange="state.startDate=this.value;save();render()"></label><p class="muted small">Дата начала влияет на предлагаемый день по календарю, но не удаляет выполненные занятия.</p></div><div class="panel"><h3>Резервная копия</h3><p class="muted">Сохраняй копию в файл: данные браузера могут быть удалены при очистке хранилища.</p><button onclick="backup()">Скачать резервную копию</button><label style="margin-top:14px">Восстановить из файла<input type="file" accept="application/json,.json" onchange="restore(this.files[0])"></label></div><div class="panel"><h3>Офлайн</h3><p class="muted">После первого открытия через HTTPS приложение кэшируется для работы без интернета. Для установки используй меню браузера «Добавить на главный экран».</p></div><div class="panel"><button class="outline" onclick="resetAll()">Сбросить весь прогресс</button></div>`}
function backup(){let blob=new Blob([JSON.stringify({app:'Fit31',version:1,exportedAt:new Date().toISOString(),progress:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fit31-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function restore(f){if(!f)return;try{let x=JSON.parse(await f.text());if(x.app!=='Fit31'||!x.progress||typeof x.progress!=='object')throw Error('Неверный формат');if(confirm('Заменить текущий прогресс данными из резервной копии?')){state=x.progress;state.days??={};state.sets??={};state.notes??={};state.measurements??={};state.selected??=1;save();render()}}catch(e){alert('Не удалось восстановить файл: '+e.message)}}function resetAll(){if(confirm('Удалить весь прогресс? Сделай резервную копию перед сбросом.')&&confirm('Подтвердить окончательное удаление?')){localStorage.removeItem(dbkey);location.reload()}}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(console.warn);
</script></body></html>
